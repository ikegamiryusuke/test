<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <title>スタンプラリー</title>
    <style>
      .hidden { display: none; }
      body {
        font-family: sans-serif;
        background: <?= background ?>;
      }
      .stamp-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: 20px auto;
        max-width: 320px;
      }
      .stamp-slot {
        width: 70px;
        height: 70px;
        line-height: 70px;
        text-align: center;
        border: 2px dashed #964b00;
        background: #fff;
        font-size: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.3s;
      }
      .stamp-slot.filled {
        transform: scale(1.1);
      }
      .stamp-slot.empty::after {
        content: "?";
        color: #ccc;
        font-size: 24px;
      }
      .dial {
        display: flex;
        gap: 5px;
        margin: 10px 0;
      }
      .digit {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 20px;
      }
      .digit .num {
        width: 40px;
        height: 40px;
        line-height: 40px;
        border: 1px solid #ccc;
        margin: 2px 0;
        font-size: 24px;
        background: #fff;
      }
      .digit div { cursor: pointer; user-select: none; }
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 40px;
        z-index: 100;
      }
      @keyframes pop {
        0% { transform: scale(0); opacity: 0; }
        50% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); opacity: 0; }
      }
      .stamp-text {
        animation: pop 1s forwards;
      }
      #stampConfetti {
        position: absolute;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background-image: radial-gradient(#ffd700 2px, transparent 2px), radial-gradient(#ff69b4 2px, transparent 2px), radial-gradient(#87cefa 2px, transparent 2px);
        background-size: 10px 10px;
        animation: pop 1s forwards;
      }
      @keyframes spin {
        from { transform: rotateX(0deg); }
        to { transform: rotateX(360deg); }
      }
      .spin .num {
        animation: spin 0.3s;
      }
    </style>
  </head>
  <body>
    <h1 id="main-title">スタンプラリー</h1>

    <div id="loginSection">
      <form id="loginForm">
        <label>冒険者名: <input type="text" name="nickname" required></label><br>
        <label>誕生日4桁: <input type="text" name="birthday" pattern="\\d{4}" required></label><br>
        <input type="button" value="ログイン/登録" onclick="submitForm()">
      </form>
    </div>

    <div id="appSection" class="hidden">
      <div id="slots" class="stamp-container"></div>

      <div id="dial" class="dial">
        <div class="digit" data-idx="0"><div class="up">▲</div><div class="num">0</div><div class="down">▼</div></div>
        <div class="digit" data-idx="1"><div class="up">▲</div><div class="num">0</div><div class="down">▼</div></div>
        <div class="digit" data-idx="2"><div class="up">▲</div><div class="num">0</div><div class="down">▼</div></div>
        <div class="digit" data-idx="3"><div class="up">▲</div><div class="num">0</div><div class="down">▼</div></div>
      </div>
      <button id="sendDial" type="button" onclick="submitDialCode()">送信</button>
      <div id="complete" style="font-weight:bold;"></div>
      <div id="stampEffect" class="overlay hidden"><div class="stamp-text">STAMP!</div><div id="stampConfetti"></div></div>
      <div id="complete-overlay" class="overlay hidden"><div class="complete-text">COMPLETE!!</div></div>
    </div>

    <script id="spot-data" type="application/json">
      <?= spotsJson ?>
    </script>

    <script>
      const spots = JSON.parse(document.getElementById('spot-data').textContent);
      const slotContainer = document.getElementById('slots');
      spots.forEach(s => {
        const div = document.createElement('div');
        div.id = 'slot-' + s.id;
        div.className = 'stamp-slot empty';
        slotContainer.appendChild(div);
      });

      let userInfo = null;
      let digits = [0, 0, 0, 0];
      let currentProgress = '';

      const updateView = (progress, complete) => {
        currentProgress = progress;
        const slots = document.querySelectorAll('.stamp-slot');
        for (let i = 0; i < slots.length; i++) {
          if (progress[i] === '1') {
            slots[i].classList.remove('empty');
            slots[i].classList.add('filled');
            slots[i].innerHTML = `<img src="${spots[i].img}" width="60" height="60">`;
          } else {
            slots[i].classList.remove('filled');
            slots[i].classList.add('empty');
            slots[i].innerHTML = '';
          }
        }
        document.getElementById('complete').textContent = complete ? '大冒険達成!!' : '';
        document.getElementById('complete-overlay').classList.toggle('hidden', !complete);
      };

      const changeDigit = (idx, delta) => {
        digits[idx] = (digits[idx] + delta + 10) % 10;
        const digit = document.querySelectorAll('.digit')[idx];
        digit.classList.add('spin');
        digit.querySelector('.num').textContent = digits[idx];
        setTimeout(() => digit.classList.remove('spin'), 300);
      };

      document.querySelectorAll('.digit').forEach(d => {
        const idx = parseInt(d.dataset.idx, 10);
        d.querySelector('.up').addEventListener('click', () => changeDigit(idx, 1));
        d.querySelector('.down').addEventListener('click', () => changeDigit(idx, -1));
      });

      const submitForm = () => {
        const form = document.getElementById('loginForm');
        const data = Object.fromEntries(new FormData(form));
        google.script.run.withSuccessHandler(res => {
          if (res.status === 'error') {
            alert(res.message);
            return;
          }
          userInfo = { nickname: data.nickname, birthday: data.birthday, row: res.row };
          document.getElementById('loginSection').style.display = 'none';
          document.getElementById('appSection').style.display = 'block';
          updateView(res.progress, res.progress.indexOf('0') === -1);
        }).processLogin(data);
      };

      const submitDialCode = () => {
        if (!userInfo) return;
        const code = digits.join('');
        const payload = { nickname: userInfo.nickname, birthday: userInfo.birthday, code, row: userInfo.row };
        google.script.run.withSuccessHandler(res => {
          if (res.error) {
            alert(res.error);
            return;
          }
          if (res.progress !== currentProgress) {
            const eff = document.getElementById('stampEffect');
            eff.classList.remove('hidden');
            setTimeout(() => eff.classList.add('hidden'), 1200);
          }
          userInfo.row = res.row;
          updateView(res.progress, res.complete);
        }).submitCode(payload);
      };
    </script>
  </body>
</html>
